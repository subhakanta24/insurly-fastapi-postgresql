services:
  db:
    image: postgres:16
    container_name: insurly-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-insurly}
      POSTGRES_USER: ${POSTGRES_USER:-insurly}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD before starting PostgreSQL}
    ports:
      - "5432:5432"
    volumes:
      - insurly_pgdata:/var/lib/postgresql/data

volumes:
  insurly_pgdata:
